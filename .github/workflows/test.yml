name: MiniC Compiler Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install LLVM 16 and Clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 16
        sudo apt-get install -y llvm-16-dev clang-16
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-16 100
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-16 100
    
    - name: Create dummy module command
      run: |
        sudo tee /usr/local/bin/module > /dev/null << 'SCRIPT'
        #!/bin/bash
        # Dummy module command for CI - does nothing
        echo "module command (CI): ignoring '$@'"
        SCRIPT
        sudo chmod +x /usr/local/bin/module
    
    - name: Build compiler
      working-directory: ./code
      run: make
    
    - name: Run tests (compile only)
      working-directory: ./code/tests
      run: |
        # Override DCS paths with CI paths
        export LLVM_INSTALL_PATH=/usr
        export PATH=/usr/bin:$PATH
        export LD_LIBRARY_PATH=/usr/lib:$LD_LIBRARY_PATH
        
        ./tests.sh -compile_only
    
    - name: Show results
      if: always()
      run: echo "Tests completed!"