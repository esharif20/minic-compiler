name: MiniC Compiler Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install LLVM 16 and Clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 16
        sudo apt-get install -y llvm-16-dev clang-16
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-16 100
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-16 100
    
    - name: Verify LLVM installation
      run: |
        echo "LLVM version:"
        llvm-config --version
        echo "Clang version:"
        clang++ --version
    
    - name: Build compiler
      working-directory: ./code
      run: make
    
    - name: Run tests (compile only)
      working-directory: ./code
      run: ./tests/tests.sh -compile_only
    
    - name: Display test results
      if: always()
      run: |
        echo "Tests completed!"
        ls -la code/